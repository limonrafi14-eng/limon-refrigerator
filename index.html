<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লিমন রেফ্রিজারেটর</title>
<style>
body{margin:0;background:#f3f7fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#17212b}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d4f7d,#1682b9);padding:18px}.box,.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 25px #0001}.box{width:min(400px,100%)}h1{color:#1266a3;text-align:center}.wrap{max-width:1150px;margin:20px auto;padding:0 16px}.top{background:#fff;padding:13px 17px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:15px;background:#fff;border-radius:15px}.n{font-size:25px;font-weight:900}label{display:block;font-weight:700;margin:9px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d7dee7;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.p{background:#1266a3;color:#fff}.s{background:#e8f2f9;color:#1266a3}.r{background:#ffebeb;color:#b21f1f}.form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.table{overflow:auto;margin-top:15px}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px}.modal>div{background:#fff;border-radius:16px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m{padding:12px;border:1px solid #ddd;border-radius:9px;text-align:center}.paid{background:#e5f7ed;border-color:#68bf91}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.form{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}}
</style>
<body>
<div id="login" class="login"><div class="box"><h1>❄ লিমন রেফ্রিজারেটর</h1><p style="text-align:center">Online Admin Panel</p><label>Username</label><input id="u" value="admin"><label>Password</label><input id="pw" type="password" placeholder="Password"><button class="btn p" style="width:100%;margin-top:15px" onclick="login()">Login</button><p style="font-size:12px;color:#777;text-align:center">প্রথম login: admin / 1234</p></div></div>
<div id="app" class="hidden"><div class="top"><b>❄ লিমন রেফ্রিজারেটর</b><button class="btn s" onclick="logout()">Logout</button></div><main class="wrap">
<div class="grid"><div class="stat">কাস্টমার<div class="n" id="c">0</div></div><div class="stat">ফ্রিজ<div class="n" id="f">0</div></div><div class="stat">মাসিক ভাড়া<div class="n" id="r">৳0</div></div><div class="stat">আদায়<div class="n" id="p">৳0</div></div><div class="stat">বকেয়া<div class="n" id="d">৳0</div></div></div>
<div class="card" style="margin-top:16px"><h2>নতুন কাস্টমার</h2><div class="form">
<div><label>Customer ID</label><input id="cid" placeholder="LR-001"></div><div><label>নাম</label><input id="name"></div><div><label>মোবাইল</label><input id="phone"></div><div><label>Fridge No.</label><input id="fridge"></div><div><label>তারিখ</label><input id="date" type="date"></div><div><label>মাসিক ভাড়া</label><input id="rent" type="number" value="500"></div><div><label>Advance</label><input id="adv" type="number"></div><div><label>Brand</label><input id="brand"></div><div><label>Status</label><select id="status"><option value="active">চলমান</option><option value="inactive">বন্ধ</option></select></div><div style="align-self:end"><button class="btn p" onclick="add()">Save</button></div></div></div>
<div class="card"><h2>কাস্টমার তালিকা</h2><input id="q" placeholder="নাম / ID / মোবাইল / Fridge No. খুঁজুন" oninput="render()"><div class="table"><table><thead><tr><th>ID</th><th>নাম</th><th>মোবাইল</th><th>ফ্রিজ</th><th>ভাড়া</th><th>অ্যাডভান্স</th><th>স্ট্যাটাস</th><th>কাজ</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<div id="modal" class="modal hidden"><div><div style="display:flex;justify-content:space-between"><h2 id="title"></h2><button class="btn r" onclick="closeM()">বন্ধ</button></div><div id="monthbox" class="months"></div></div></div>
<script>
let token=localStorage.limonToken||"",customers=[],sel=null;const mn=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];document.getElementById("date").value=new Date().toISOString().slice(0,10);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};let r=await fetch(url,opt);let x=await r.json();if(r.status===401){logout();throw Error("Unauthorized")}return x}
async function login(){let rr=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:pw.value})}),x=await rr.json();if(!rr.ok)return alert(x.error||"Login failed");token=x.token;localStorage.limonToken=token;show()}
function show(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");load()}
function logout(){localStorage.removeItem("limonToken");token="";document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
async function load(){customers=await api("/api/customers");let x=await api("/api/dashboard");c.textContent=x.customers;f.textContent=x.fridges;r.textContent="৳"+Number(x.rent).toLocaleString();p.textContent="৳"+Number(x.paid).toLocaleString();d.textContent="৳"+Number(x.due).toLocaleString();render()}
async function add(){let x={customer_id:cid.value,name:name.value,phone:phone.value,fridge_no:fridge.value,date:date.value,rent:rent.value,advance:adv.value,brand:brand.value,status:status.value};let z=await api("/api/customers",{method:"POST",body:JSON.stringify(x)});if(z.error)return alert(z.error);["cid","name","phone","fridge","adv","brand"].forEach(i=>document.getElementById(i).value="");load()}
function render(){let q=document.getElementById("q").value.toLowerCase();rows.innerHTML="";customers.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q)).forEach(x=>rows.innerHTML+=`<tr><td>${x.customer_id}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.fridge_no}</td><td>৳${x.rent}</td><td>৳${x.advance}</td><td>${x.status==="active"?"চলমান":"বন্ধ"}</td><td><button class="btn s" onclick="openMonths(${x.id})">মাসিক হিসাব</button> <button class="btn r" onclick="del(${x.id})">মুছুন</button></td></tr>`)}
async function del(id){if(confirm("মুছে ফেলবেন?")){await api("/api/customers/"+id,{method:"DELETE"});load()}}
async function openMonths(id){sel=customers.find(x=>x.id===id);title.textContent=sel.name+" — "+sel.fridge_no;let ps=await api("/api/payments/"+id),map=Object.fromEntries(ps.map(x=>[x.month,x]));monthbox.innerHTML="";let y=new Date().getFullYear();for(let i=0;i<12;i++){let key=y+"-"+String(i+1).padStart(2,"0"),x=map[key],el=document.createElement("div");el.className="m "+(x?.paid?"paid":"");el.innerHTML=mn[i]+" "+y+"<br><b>"+(x?.paid?"পরিশোধিত":"বাকি")+"</b>";el.onclick=async()=>{await api("/api/payments",{method:"POST",body:JSON.stringify({customer_id:id,month:key,amount:sel.rent,paid:!x?.paid})});openMonths(id);load()};monthbox.appendChild(el)}document.getElementById("modal").classList.remove("hidden")}
function closeM(){document.getElementById("modal").classList.add("hidden")}
if(token)show();
</script></body></html>
